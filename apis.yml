aid: forte
name: Forte
description: >-
  Forte is a Web3 economic infrastructure company building compliance and economic tools
  for games and digital-asset economies. Its flagship product is the Forte Rules Engine, a
  free, open-source, EVM-compatible on-chain policy engine that lets smart-contract developers
  define composable, adaptive rules (KYC gates, OFAC/sanctions screening, vesting schedules,
  circuit breakers, and other economic guardrails) without hardcoding logic into their
  contracts. The Rules Engine ships a TypeScript SDK and Solidity client contracts, and is
  complemented by a ZK Policy Engine for privacy-preserving policy enforcement. Forte is
  backed by a16z, Canaan Partners, and Trinity Ventures.
